<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Pizza N Coke</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">
  <div class="dashboard-nav">
    <div class="logo">Pizza 🍕 <span>N</span> <b>Coke</b></div>

    <a href="dashboard.html" class="logout-button">
      Dashboard
    </a>
  </div>
</header>

<main class="page-container">

  <div class="page-card">

    <div class="plans-heading">
      <h2>My Profile</h2>
      <p>Manage your Pizza N Coke account information.</p>
    </div>

    <div class="input-group">
      <label>Username</label>
      <input id="username" type="text" readonly>
    </div>

    <div class="input-group">
      <label>Gmail</label>
      <input id="email" type="email" readonly>
    </div>

    <div class="input-group">
      <label>Referral Code</label>
      <input id="referral" type="text" readonly>
    </div>

    <div class="input-group">
      <label>Account Balance</label>
      <input id="balance" type="text" readonly>
    </div>

    <div id="message" class="message"></div>

    <button id="logout" class="next-button">
      LOG OUT
    </button>

  </div>

</main>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const username = document.getElementById("username");
const email = document.getElementById("email");
const referral = document.getElementById("referral");
const balance = document.getElementById("balance");


function money(value) {
  return "₦" + Number(value || 0).toLocaleString("en-NG", {
    minimumFractionDigits: 2
  });
}


onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  const snap = await getDoc(
    doc(db, "users", user.uid)
  );

  const data = snap.exists() ? snap.data() : {};

  username.value =
    data.username || user.displayName || "User";

  email.value =
    data.email || user.email || "";

  referral.value =
    data.referralCode || "Not provided";

  balance.value =
    money(data.walletBalance);

});


document.getElementById("logout")
  .addEventListener("click", async () => {

    await signOut(auth);
    location.href = "login.html";

  });

</script>

</body>
</html>
