<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Pizza N Coke</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="register-hero">

  <div class="container">

    <div class="logo">
      Pizza 🍕 <span>N</span> <b>Coke</b>
    </div>

    <h1>
      GOOD FOOD,<br>
      GREATER REWARDS.
    </h1>

    <p>
      Create your Pizza N Coke customer account.
    </p>

    <div class="hero-tags">
      <span>✓ DAILY ACTIVITY</span>
      <span>✓ COMMUNITY</span>
      <span>✓ REWARDS</span>
    </div>

  </div>

</section>


<div class="register-container">

  <div class="register-card">

    <div class="register-title">

      <div class="yellow-title">
        CREATE YOUR ACCOUNT
      </div>

      <h2>Join Pizza N Coke</h2>

      <p>
        Start your journey today.
      </p>

    </div>


    <div id="message" class="message"></div>


    <!-- USERNAME -->

    <div class="input-group">

      <label>Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
      >

    </div>


    <!-- EMAIL -->

    <div class="input-group">

      <label>Gmail</label>

      <input
        type="email"
        id="email"
        placeholder="Enter Gmail"
      >

    </div>


    <!-- REFERRAL -->

    <div class="input-group">

      <label>Referral Code</label>

      <input
        type="text"
        id="referral"
        placeholder="Enter referral code"
      >

    </div>


    <!-- PASSWORD -->

    <div class="input-group password-box">

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create password"
      >

      <button
        type="button"
        onclick="togglePassword('password')"
      >
        👁
      </button>

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="input-group password-box">

      <label>Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm password"
      >

      <button
        type="button"
        onclick="togglePassword('confirmPassword')"
      >
        👁
      </button>

    </div>


    <button
      id="registerBtn"
      class="next-button"
    >
      NEXT →
    </button>


    <p class="login-link">

      Already a member?

      <a href="login.html">
        LOG IN
      </a>

    </p>

  </div>

</div>


<script type="module">

import {
  auth,
  db
} from "./firebase-config.js";

import {
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const username = document.getElementById("username");
const email = document.getElementById("email");
const referral = document.getElementById("referral");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const registerBtn =
  document.getElementById("registerBtn");

const message =
  document.getElementById("message");


registerBtn.addEventListener("click", async () => {

  const user = username.value.trim();
  const mail = email.value.trim();
  const ref = referral.value.trim();
  const pass = password.value;
  const confirm = confirmPassword.value;


  if (!user || !mail || !pass || !confirm) {

    showMessage(
      "Please complete all required fields.",
      "error"
    );

    return;
  }


  if (pass.length < 6) {

    showMessage(
      "Password must contain at least 6 characters.",
      "error"
    );

    return;
  }


  if (pass !== confirm) {

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  registerBtn.disabled = true;
  registerBtn.textContent = "CREATING ACCOUNT...";


  try {

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        mail,
        pass
      );


    const firebaseUser = credential.user;


    await updateProfile(
      firebaseUser,
      {
        displayName: user
      }
    );


    /*
      New customers receive the configured
      welcome balance.
    */

    await setDoc(
      doc(db, "users", firebaseUser.uid),
      {

        username: user,

        email: mail,

        referralCode: ref,

        walletBalance: 2000,

        welcomeBonus: 2000,

        welcomeBonusClaimed: true,

        createdAt: serverTimestamp()

      }
    );


    window.location.href =
      "dashboard.html";


  } catch (error) {

    console.error(error);

    showMessage(
      "Unable to create account. Check your details and try again.",
      "error"
    );

    registerBtn.disabled = false;

    registerBtn.textContent = "NEXT →";

  }

});


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


window.togglePassword = function(id) {

  const input =
    document.getElementById(id);

  input.type =
    input.type === "password"
      ? "text"
      : "password";

};

</script>

</body>
</html>
