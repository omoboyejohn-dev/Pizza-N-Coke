<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Pizza N Coke</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #050505;
        }

        .auth-left {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 60px;
            background:
                linear-gradient(135deg, rgba(0,0,0,.78), rgba(0,55,130,.72)),
                url("https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1400&q=85")
                center/cover;
        }

        .auth-brand {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 30px;
        }

        .auth-brand b {
            color: #ffd21c;
        }

        .auth-brand span {
            color: #35a7ff;
        }

        .auth-left h1 {
            font-size: clamp(45px, 5vw, 75px);
            line-height: 1;
            font-weight: 900;
        }

        .auth-left h1 span {
            color: #ffd21c;
        }

        .auth-left p {
            max-width: 500px;
            margin-top: 20px;
            color: #ddd;
        }

        .auth-right {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .auth-box {
            width: min(100%, 450px);
            padding: 35px;
            background: #0b111a;
            border: 1px solid rgba(0,125,255,.3);
            border-radius: 22px;
        }

        .auth-box h2 {
            font-size: 32px;
        }

        .auth-box h2 span {
            color: #ffd21c;
        }

        .subtitle {
            color: #929ba7;
            margin: 8px 0 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,.12);
            background: #070b10;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #087cff;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: #ffd21c;
            color: #000;
            font-weight: 900;
            cursor: pointer;
        }

        .auth-submit:disabled {
            opacity: .6;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(255,50,50,.1);
            color: #ff7777;
        }

        .message.success {
            background: rgba(30,200,100,.1);
            color: #55df91;
        }

        .auth-switch {
            margin-top: 20px;
            text-align: center;
            color: #929ba7;
            font-size: 13px;
        }

        .auth-switch a {
            color: #ffd21c;
            font-weight: 800;
        }

        @media(max-width:800px) {
            .auth-page {
                grid-template-columns: 1fr;
            }

            .auth-left {
                min-height: 300px;
                padding: 40px 25px;
            }

            .auth-left h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <section class="auth-left">

        <div>

            <div class="auth-brand">
                Pizza 🍕 <b>N</b> <span>Coke</span>
            </div>

            <h1>
                GOOD FOOD.
                <br>
                <span>GOOD START.</span>
            </h1>

            <p>
                Create your Pizza N Coke account and access
                your personal dashboard.
            </p>

            <div style="font-size:55px;margin-top:25px;">
                🍕 🥤 🍕
            </div>

        </div>

    </section>


    <section class="auth-right">

        <div class="auth-box">

            <h2>
                Create <span>Account</span>
            </h2>

            <p class="subtitle">
                Register to continue.
            </p>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        id="fullName"
                        class="form-input"
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Username</label>

                    <input
                        id="username"
                        class="form-input"
                        type="text"
                        placeholder="Choose a username"
                        minlength="3"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email Address</label>

                    <input
                        id="email"
                        class="form-input"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        id="password"
                        class="form-input"
                        type="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>

                    <input
                        id="confirmPassword"
                        class="form-input"
                        type="password"
                        placeholder="Confirm password"
                        minlength="6"
                        required
                    >
                </div>

                <button
                    id="registerBtn"
                    class="auth-submit"
                    type="submit"
                >
                    Create Account
                </button>

            </form>

            <div class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </section>

</div>


<script type="module">

import {
    auth,
    db
} from "./firebase-config.js";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerBtn");


function showMessage(text, type) {

    message.textContent = text;
    message.className = "message show " + type;

}


form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const fullName =
        document.getElementById("fullName").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Creating Account...";


    try {

        /*
         * CREATE FIREBASE AUTH ACCOUNT
         */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = credential.user;


        /*
         * SAVE USERNAME TO AUTH PROFILE
         */

        await updateProfile(user, {
            displayName: username
        });


        /*
         * CREATE FIRESTORE USER DOCUMENT
         *
         * NEW USERS RECEIVE:
         *
         * ₦2,000 WELCOME BONUS
         */

        await setDoc(
            doc(db, "users", user.uid),
            {

                uid: user.uid,

                fullName: fullName,

                username: username,

                email: email,

                walletBalance: 2000,

                welcomeBonus: 2000,

                welcomeBonusClaimed: true,

                referralCode:
                    username.toUpperCase() +
                    Math.floor(
                        1000 + Math.random() * 9000
                    ),

                createdAt: serverTimestamp()

            }
        );


        showMessage(
            "Account created! Your ₦2,000 welcome bonus has been added.",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 1200);


    } catch (error) {

        console.error(error);

        let text =
            "Unable to create account.";


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            text =
                "This email is already registered.";

        }


        if (
            error.code ===
            "auth/invalid-email"
        ) {

            text =
                "Please enter a valid email address.";

        }


        if (
            error.code ===
            "auth/weak-password"
        ) {

            text =
                "Password must contain at least 6 characters.";

        }


        if (
            error.code ===
            "permission-denied"
        ) {

            text =
                "Firestore permission denied. Check your Firestore rules.";

        }


        showMessage(
            text,
            "error"
        );


        button.disabled = false;
        button.textContent = "Create Account";

    }

});

</script>

</body>
</html>
