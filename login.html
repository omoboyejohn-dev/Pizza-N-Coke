<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pizza N Coke</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="logo">Pizza 🍕 <span>N</span> <b>Coke</b></div>
</header>

<section class="auth-page">

  <div class="auth-card">

    <div class="small-title">WELCOME BACK</div>

    <h1>Login to Pizza N Coke</h1>

    <p class="subtitle">
      Access your customer account.
    </p>

    <div id="message" class="message"></div>

    <div class="input-group">
      <label>Gmail</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your Gmail"
      >
    </div>

    <div class="input-group password-box">
      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
      >

      <button
        type="button"
        onclick="togglePassword()"
      >👁</button>
    </div>

    <button id="loginBtn" class="primary-btn">
      LOG IN →
    </button>

    <p class="switch-link">
      Don't have an account?
      <a href="register.html">CREATE ACCOUNT</a>
    </p>

  </div>

</section>

<script type="module">

import { auth } from "./firebase-config.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");


function showMessage(text) {

  message.textContent = text;
  message.className = "message error";
}


loginBtn.addEventListener("click", async () => {

  const mail =
    email.value.trim();

  const pass =
    password.value;


  if (!mail || !pass) {

    showMessage(
      "Please enter your Gmail and password."
    );

    return;
  }


  loginBtn.disabled = true;
  loginBtn.textContent = "LOGGING IN...";


  try {

    await signInWithEmailAndPassword(
      auth,
      mail,
      pass
    );


    window.location.href =
      "dashboard.html";


  } catch (error) {

    console.error(error);

    let text =
      "Unable to log in. Please try again.";


    if (
      error.code ===
      "auth/invalid-credential"
    ) {

      text =
        "Incorrect Gmail or password.";

    }


    if (
      error.code ===
      "auth/user-not-found"
    ) {

      text =
        "No account was found with this Gmail.";

    }


    showMessage(text);

    loginBtn.disabled = false;
    loginBtn.textContent = "LOG IN →";

  }

});


window.togglePassword = function() {

  password.type =
    password.type === "password"
      ? "text"
      : "password";

};

</script>

</body>
</html>
