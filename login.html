<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Pizza N Coke</title>

  <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


<div class="login-container">

  <div class="login-card">


    <div class="pizza-logo">

      🍕 🥤

    </div>


    <div class="logo dark-logo">

      Pizza 🍕
      <span>N</span>
      <b>Coke</b>

    </div>


    <h1>
      Welcome Back
    </h1>

    <p>
      Login to your Pizza N Coke account.
    </p>


    <div
      id="message"
      class="message"
    ></div>


    <div class="input-group">

      <label>
        Gmail
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter Gmail"
      >

    </div>


    <div class="input-group password-box">

      <label>
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
      >

      <button
        type="button"
        onclick="togglePassword()"
      >
        👁
      </button>

    </div>


    <button
      id="loginBtn"
      class="next-button"
    >

      LOG IN

    </button>


    <p class="login-link">

      Don't have an account?

      <a href="register.html">
        CREATE ACCOUNT
      </a>

    </p>


  </div>

</div>


<script type="module">

import {
  auth
} from "./firebase-config.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");


loginBtn.addEventListener(
  "click",
  async () => {

    const mail =
      email.value.trim();

    const pass =
      password.value;


    if (!mail || !pass) {

      showMessage(
        "Enter your Gmail and password.",
        "error"
      );

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "LOGGING IN...";


    try {

      await signInWithEmailAndPassword(
        auth,
        mail,
        pass
      );


      window.location.href =
        "dashboard.html";


    } catch (error) {

      console.error(error);

      showMessage(
        "Login failed. Check your Gmail and password.",
        "error"
      );

      loginBtn.disabled = false;

      loginBtn.textContent =
        "LOG IN";

    }

  }
);


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


window.togglePassword = function() {

  password.type =
    password.type === "password"
      ? "text"
      : "password";

};

</script>


</body>

</html>
