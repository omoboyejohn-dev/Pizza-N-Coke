<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Withdraw | Pizza N Coke</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="dashboard-header">

  <div class="dashboard-nav">

    <div class="logo">
      Pizza 🍕 <span>N</span> <b>Coke</b>
    </div>

    <a
      href="dashboard.html"
      class="logout-button"
    >
      Dashboard
    </a>

  </div>

</header>


<main class="page-container">

  <div class="page-card">

    <div class="plans-heading">

      <h2>
        Withdraw
      </h2>

      <p>
        Submit a withdrawal request.
      </p>

    </div>


    <div class="plan-card" style="margin-top:20px;">

      <div class="plan-number">
        AVAILABLE BALANCE
      </div>

      <div
        id="balance"
        class="plan-price"
      >
        ₦0.00
      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div class="input-group">

      <label>
        Amount
      </label>

      <input
        type="number"
        id="amount"
        placeholder="Enter withdrawal amount"
        min="1"
      >

    </div>


    <div class="input-group">

      <label>
        Bank Name
      </label>

      <input
        type="text"
        id="bankName"
        placeholder="Enter bank name"
      >

    </div>


    <div class="input-group">

      <label>
        Account Number
      </label>

      <input
        type="text"
        id="accountNumber"
        placeholder="Enter account number"
      >

    </div>


    <div class="input-group">

      <label>
        Account Name
      </label>

      <input
        type="text"
        id="accountName"
        placeholder="Enter account name"
      >

    </div>


    <button
      id="withdrawBtn"
      class="next-button"
    >
      REQUEST WITHDRAWAL
    </button>

  </div>

</main>


<script type="module">

import {
  auth,
  db
} from "./firebase-config.js";


import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  doc,
  getDoc,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let currentUser = null;

let walletBalance = 0;


function money(value) {

  return "₦" +
    Number(value || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2
      }
    );

}


onAuthStateChanged(auth, async (user) => {

  if (!user) {

    location.href = "login.html";

    return;

  }


  currentUser = user;


  const snap =
    await getDoc(
      doc(db, "users", user.uid)
    );


  if (snap.exists()) {

    walletBalance =
      Number(
        snap.data().walletBalance || 0
      );

  }


  document.getElementById("balance")
    .textContent =
      money(walletBalance);

});


document
  .getElementById("withdrawBtn")
  .addEventListener("click", async () => {


    const amount =
      Number(
        document.getElementById("amount").value
      );


    const bankName =
      document.getElementById("bankName")
        .value.trim();


    const accountNumber =
      document.getElementById("accountNumber")
        .value.trim();


    const accountName =
      document.getElementById("accountName")
        .value.trim();


    const message =
      document.getElementById("message");


    if (!amount || amount <= 0) {

      message.textContent =
        "Enter a valid withdrawal amount.";

      message.className =
        "message error";

      return;

    }


    if (amount > walletBalance) {

      message.textContent =
        "Insufficient available balance.";

      message.className =
        "message error";

      return;

    }


    if (
      !bankName ||
      !accountNumber ||
      !accountName
    ) {

      message.textContent =
        "Please complete your bank details.";

      message.className =
        "message error";

      return;

    }


    const button =
      document.getElementById("withdrawBtn");

    button.disabled = true;

    button.textContent =
      "SUBMITTING...";


    try {

      await addDoc(
        collection(db, "withdrawalRequests"),
        {

          uid: currentUser.uid,

          email: currentUser.email,

          amount: amount,

          bankName: bankName,

          accountNumber: accountNumber,

          accountName: accountName,

          status: "pending",

          createdAt: serverTimestamp()

        }
      );


      message.textContent =
        "Withdrawal request submitted successfully.";

      message.className =
        "message success";


      document.getElementById("amount").value = "";

      document.getElementById("bankName").value = "";

      document.getElementById("accountNumber").value = "";

      document.getElementById("accountName").value = "";


    } catch (error) {

      console.error(error);

      message.textContent =
        "Unable to submit withdrawal request.";

      message.className =
        "message error";

    }


    button.disabled = false;

    button.textContent =
      "REQUEST WITHDRAWAL";

  });

</script>

</body>
</html>
